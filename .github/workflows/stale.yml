name: Stale Issues and PRs

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

# Least-privilege floor; job elevates as needed
permissions: {}

jobs:
  stale:
    name: Mark Stale Issues and PRs
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Stale action
        uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues
          stale-issue-message: |
            👋 This issue has been automatically marked as stale because it has not had recent activity.
            It will be closed in 7 days if no further activity occurs.

            If this issue is still relevant, please:
            - Add a comment to keep it open
            - Add the `keep-open` label
            - Remove the `stale` label

            Thank you for your contributions! 🙏

          close-issue-message: |
            🔒 This issue has been automatically closed due to inactivity.

            If you believe this issue should be reopened, please:
            - Create a new issue with updated information
            - Or comment on this issue and a maintainer will review

          days-before-issue-stale: 60
          days-before-issue-close: 7

          # PRs
          stale-pr-message: |
            👋 This pull request has been automatically marked as stale because it has not had recent activity.
            It will be closed in 14 days if no further activity occurs.

            If this PR is still being worked on, please:
            - Add a comment to keep it open
            - Add the `keep-open` label
            - Remove the `stale` label

          close-pr-message: |
            🔒 This pull request has been automatically closed due to inactivity.

            Feel free to reopen if you wish to continue working on it.

          days-before-pr-stale: 30
          days-before-pr-close: 14

          # Exemptions
          exempt-issue-labels: 'keep-open,pinned,security,bug,in-progress'
          exempt-pr-labels: 'keep-open,pinned,security,bug,in-progress'
          exempt-all-milestones: true
          exempt-all-assignees: false

          # Operations
          operations-per-run: 30
          remove-stale-when-updated: true
