name: Welcome

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

# Least-privilege floor; job elevates as needed
permissions: {}

jobs:
  welcome:
    name: Welcome New Contributors
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Welcome new issue creators
        if: github.event_name == 'issues'
        uses: actions/github-script@v8
        with:
          script: |
            const issue = context.payload.issue;
            const isFirstIssue = (await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: issue.user.login,
              state: 'all'
            })).data.length === 1;

            if (isFirstIssue) {
              const message = `👋 Welcome to Omni-Grid, @${issue.user.login}!
              
              Thank you for opening your first issue! We appreciate your contribution to making Omni-Grid better.
              
              ## 📋 What's Next?
              
              - A maintainer will review your issue soon
              - Please provide as much detail as possible to help us understand and address your concern
              - Feel free to join our [discussions](https://github.com/GizzZmo/Omni-Grid-2.0/discussions) for questions
              
              ## 📚 Helpful Resources
              
              - [Contributing Guidelines](https://github.com/GizzZmo/Omni-Grid-2.0/blob/main/CONTRIBUTING.md)
              - [Documentation](https://github.com/GizzZmo/Omni-Grid-2.0/tree/main/docs)
              - [Code of Conduct](https://github.com/GizzZmo/Omni-Grid-2.0/blob/main/CODE_OF_CONDUCT.md)
              
              We're excited to have you here! 🚀`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: message
              });
            }

      - name: Welcome new PR authors
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const isFirstPR = (await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              creator: pr.user.login
            })).data.length === 1;

            if (isFirstPR) {
              const message = `👋 Welcome to Omni-Grid, @${pr.user.login}!
              
              Thank you for your first pull request! Your contribution helps make Omni-Grid better for everyone.
              
              ## 📋 Review Process
              
              - A maintainer will review your PR soon
              - CI checks must pass before merge
              - Please ensure your code follows our [Contributing Guidelines](https://github.com/GizzZmo/Omni-Grid-2.0/blob/main/CONTRIBUTING.md)
              
              ## ✅ Checklist
              
              - [ ] Tests added/updated as needed
              - [ ] Documentation updated if applicable
              - [ ] Code follows project style guidelines
              - [ ] No security concerns (see plugin-security.md for widgets)
              
              Thank you for contributing! 🎉`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: message
              });
            }
