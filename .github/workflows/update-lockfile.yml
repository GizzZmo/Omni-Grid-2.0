name: Update package-lock.json

on:
  # Manual trigger — primary way to regenerate the lockfile
  workflow_dispatch:
    inputs:
      force:
        description: 'Delete existing lockfile and regenerate from scratch'
        required: false
        default: true
        type: boolean
  # Also run when package.json is changed on main/develop (keeps lockfile in sync)
  push:
    branches: [main, develop]
    paths:
      - 'package.json'
  # Allow running from a PR that touches package.json
  pull_request:
    paths:
      - 'package.json'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-lockfile:
    name: Regenerate package-lock.json
    runs-on: ubuntu-latest
    # Skip on Dependabot PRs (Dependabot already updates the lockfile)
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # For PRs, check out the head ref so we can push back if needed
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Remove existing lockfile (force / missing)
        if: github.event_name == 'workflow_dispatch' && inputs.force == true || !hashFiles('package-lock.json')
        run: |
          if [ -f package-lock.json ]; then
            echo "Removing existing package-lock.json for clean regeneration"
            rm -f package-lock.json
          else
            echo "No package-lock.json present — will generate a new one"
          fi

      - name: Generate / update package-lock.json
        run: |
          echo "Running npm install --package-lock-only ..."
          npm install --package-lock-only --no-fund --no-audit
          echo "Lockfile size: $(wc -c < package-lock.json) bytes"
          # Basic sanity checks
          python3 -c "
          import json, sys
          with open('package-lock.json') as f:
              data = json.load(f)
          assert data.get('lockfileVersion') >= 2, 'Invalid lockfileVersion'
          assert 'packages' in data or 'dependencies' in data, 'Missing packages/dependencies'
          n = len(data.get('packages', data.get('dependencies', {})))
          print(f'OK: lockfileVersion={data.get(\"lockfileVersion\")}, entries={n}')
          if n < 10:
              print('WARNING: suspiciously few packages — check package.json')
              sys.exit(1)
          "

      - name: Verify npm ci works
        run: |
          rm -rf node_modules
          npm ci --no-fund --no-audit
          echo "✅ npm ci succeeded with the new lockfile"

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to package-lock.json"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "package-lock.json has been updated"
            git diff --stat -- package-lock.json
          fi

      # On workflow_dispatch or push to main/develop → open a PR with the new lockfile
      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            fix(ci): regenerate package-lock.json

            Auto-generated by the Update package-lock.json workflow.
            Ensures npm ci works and lockfile matches package.json.
          title: 'fix(ci): regenerate package-lock.json'
          body: |
            ## 🔒 Lockfile update

            This PR was created automatically by the **Update package-lock.json** workflow.

            ### What changed
            - Regenerated `package-lock.json` from the current `package.json`
            - Verified that `npm ci` succeeds with the new lockfile

            ### Why
            Keeping the lockfile in sync prevents `npm ci` failures (EUSAGE / peer conflicts) in CI.

            ---
            *Triggered by: `${{ github.event_name }}`*
          branch: chore/update-package-lock
          delete-branch: true
          labels: |
            dependencies
            automated
            ci-cd
          reviewers: GizzZmo

      # On PRs that touch package.json → fail if lockfile is out of date (forces contributor to update it)
      - name: Fail if lockfile is out of sync (PR check)
        if: steps.changes.outputs.changed == 'true' && github.event_name == 'pull_request'
        run: |
          echo "::error::package-lock.json is out of sync with package.json"
          echo "Please run: npm install --package-lock-only"
          echo "Then commit the updated package-lock.json"
          exit 1
